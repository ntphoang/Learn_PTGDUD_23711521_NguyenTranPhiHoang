<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let Mmass = 95;
        let Mheight = 1.88;
        let Jmass = 85;
        let Jheight = 1.76;

        let MBMI = Mmass / Math.pow(Mheight,2);
        let JBMI = Jmass / Math.pow(Jheight,2);

        let markHigherBMI = true;
        markHigherBMI = MBMI > JBMI;

        // Task 1: Print a nice output to the console, saying who has the higher BMI. The message
        // is either "Mark's BMI is higher than John's!" or "John's BMI is higher than Mark's!
        if (markHigherBMI){
            console.log("Mark's BMI is higher than John's!");
        }else{
            console.log("John's BMI is higher than Mark's!");
        }

        // Task 2: Use a template literal to include the BMI values in the outputs. Example: "Mark's
        // BMI (28.3) is higher than John's (23.9)!"
        if (markHigherBMI){
            console.log(`Mark's BMI(${MBMI}) is higher than John's(${JBMI})!`);
        }else{
            console.log(`John's BMI(${JBMI}) is higher than Mark's(${MBMI})!`);
        }
    </script>
</body>
</html>
