<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button id="answerPoll">Answer poll</button>
    <script>
      // Let's build a simple poll app!
      // A poll has a question, an array of options from which people can choose, and an
      // array with the number of replies for each option. This data is stored in the starter
      // 'poll' object below.
      let btn = document.getElementById("answerPoll");
      const poll = {
        question: "What is your favourite programming language?",
        options: ["0: JavaScript", "1: Python", "2: Rust", "3:C++"],
        // This generates [0, 0, 0, 0]. More in the next section!
        answers: new Array(4).fill(0),
      };
      // Your tasks:
      // 1. Create a method called 'registerNewAnswer' on the 'poll' object. The
      // method does 2 things:
      poll.registerNewAnswer = function () {
        // 1.1. Display a prompt window for the user to input the number of the
        // selected option. The prompt should look like this:
        // What is your favourite programming language?
        // 0: JavaScript
        // 1: Python
        // 2: Rust
        // 3: C++
        // (Write option number)
        let answer = parseInt(
          prompt(
            "What is your favourite programming language?\n0: JavaScript \n1: Python\n2: Rust\n3: C++\n(Write option number)"
          )
        );
        if (answer < 0 || answer > 3) {
          alert("Lựa chọn không hợp lệ! Vui lòng chọn từ 0 -> 3.");
        } else {
          this.answers[answer]++;
        }
        // 1.2. Based on the input number, update the 'answers' array property. For
        // example, if the option is 3, increase the value at position 3 of the array by
        this.displayResults();
        this.displayResults("string")
      };

      // 2. Call this method whenever the user clicks the "Answer poll" button.
      btn.addEventListener("click", poll.registerNewAnswer.bind(poll));

      // 3. Create a method 'displayResults' which displays the poll results. The
      // method takes a string as an input (called 'type'), which can be either 'string'
      // or 'array'. If type is 'array', simply display the results array as it is, using
      // console.log(). This should be the default option. If type is 'string', display a
      // string like "Poll results are 13, 2, 4, 1".
      poll.displayResults = function (type = "array") {
        if (type == "array") {
          console.log(this.answers);
        } else if (type == "string") {
          console.log(`Poll results are ${this.answers.join(",")}`);
        }
      };
      // 4. Run the 'displayResults' method at the end of each
      // 'registerNewAnswer' method call.

      // 5. Bonus: Use the 'displayResults' method to display the 2 arrays in the test
      // data. Use both the 'array' and the 'string' option. Do not put the arrays in the poll
      // object! So what should the this keyword look like in this situation?
    </script>
  </body>
</html>
