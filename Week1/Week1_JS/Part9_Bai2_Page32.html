<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="images" style="width: 200px; height: 100px"></div>
    <script>
      // For this challenge you will actually have to watch the video! Then, build the image
      // loading functionality that I just showed you on the screen.
      // Your tasks:
      // Tasks are not super-descriptive this time, so that you can figure out some stuff by
      // yourself. Pretend you're working on your own 😉
      // PART 1
      // 1. Create a function 'createImage' which receives 'imgPath' as an input.
      // This function returns a promise which creates a new image (use
      // document.createElement('img')) and sets the .src attribute to the
      // provided image path
      function createImage(imgPath) {
        return new Promise((resolve, reject) => {
          const anh = document.createElement("img");
          anh.setAttribute("src", `${imgPath}`);

          // 2. When the image is done loading, append it to the DOM element with the
          // 'images' class, and resolve the promise. The fulfilled value should be the
          // image element itself. In case there is an error loading the image (listen for
          // the'error' event), reject the promise
          // 3. If this part is too tricky for you, just watch the first part of the solution
          anh.addEventListener("load", () => {
            document.querySelector(".images").appendChild(anh);
            resolve(anh);
          });

          anh.addEventListener("error", () => {
            reject(new Error("Không tìm thấy ảnh!"));
          });
        });
      }

      //Hàm chờ bằng promise và settimeout
      function wait(time) {
        return new Promise((resolve) => {
          setTimeout(resolve, time * 1000);
        });
      }

      // PART 2
      // 4. Consume the promise using .then and also add an error handler
      let anhHienTai = null;
      createImage("Anh_Demo/Anh1.png")
        .then((image) => {
          anhHienTai = image;
          console.log("Load thành công!");
          // 5. After the image has loaded, pause execution for 2 seconds using the 'wait'
          // function we created earlier
          return wait(2);
        })
        // 6. After the 2 seconds have passed, hide the current image (set display CSS
        // property to 'none'), and load a second image (Hint: Use the image element
        // returned by the 'createImage' promise to hide the current image. You will
        // need a global variable for that 😉)
        .then(() => {
          anhHienTai.style.display = "none";
          return createImage("Anh_Demo/Anh2.png");
        })
        // 7. After the second image has loaded, pause execution for 2 seconds again
        .then((image2) => {
          anhHienTai = image2;
          return wait(2);
        })
        // 8. After the 2 seconds have passed, hide the current image
        .then(() => {
          anhHienTai.style.display = "none";
        })
        .catch((err) => {
          console.error(err);
        });

      // Test data: Images in the img folder. Test the error handler by passing a wrong
      // image path. Set the network speed to “Fast 3G” in the dev tools Network tab,
      // otherwise images load too fast
    </script>
  </body>
</html>
