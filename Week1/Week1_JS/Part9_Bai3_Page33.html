<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="images" style="width: 200px; height: 100px"></div>
    <script>
      function createImage(imgPath) {
        return new Promise((resolve, reject) => {
          const anh = document.createElement("img");
          anh.setAttribute("src", `${imgPath}`);

          anh.addEventListener("load", () => {
            document.querySelector(".images").appendChild(anh);
            resolve(anh);
          });

          anh.addEventListener("error", () => {
            reject(new Error("Không tìm thấy ảnh!"));
          });
        });
      }

      //Hàm chờ bằng promise và settimeout
      function wait(time) {
        return new Promise((resolve) => {
          setTimeout(resolve, time * 1000);
        });
      }

      // PART 1
      // 1. Write an async function 'loadNPause' that recreates Challenge #2, this time
      // using async/await (only the part where the promise is consumed, reuse the
      // 'createImage' function from before)
      // 2. Compare the two versions, think about the big differences, and see which one
      // you like more
      // 3. Don't forget to test the error handler, and to set the network speed to “Fast 3G”
      // in the dev tools Network tab
      async function loadNPause() {
        try {
          // tạo ảnh 1, chờ 2s, ẩn ảnh 1
          const img1 = await createImage("Anh_Demo/Anh1.png");
          await wait(2);
          img1.style.display = "none";

          const img2 = await createImage("Anh_Demo/Anh2.png");
          await wait(2);
          img2.style.display = "none";
        } catch (error) {
          console.log(error);
        }
      }
      loadNPause();

      // PART 2
      // 1. Create an async function 'loadAll' that receives an array of image paths
      // 'imgArr'
      async function loadAll(imgArr) {
        // 2. Use .map to loop over the array, to load all the images with the
        // 'createImage' function (call the resulting array 'imgs')
        let imgs = imgArr.map((img) => {
          return createImage(img);
        });
        // 3. Check out the 'imgs' array in the console! Is it like you expected?
        // 4. Use a promise combinator function to actually get the images from the array 😉
        const imgElement = await Promise.all(imgs);
        // 5. Add the 'parallel' class to all the images (it has some CSS styles)

        imgElement.forEach((img) => img.classList.add("parallel"));
      }
      loadAll(["Anh_Demo/Anh1.png", "Anh_Demo/Anh2.png", "Anh_Demo/Anh3.png"]);
      // Test data Part 2: ['img/img-1.jpg', 'img/img-2.jpg', 'img/img-
      // 3.jpg']. To test, turn off the 'loadNPause' function
    </script>
  </body>
</html>
