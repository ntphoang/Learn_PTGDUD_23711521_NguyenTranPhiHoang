<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // Let's improve Steven's tip calculator even more, this time using loops!

      // Your tasks:
      // 1. Create an array 'bills' containing all 10 test bill values
        bills = [22, 295, 176, 440, 37, 105, 10, 1100, 86 ,52];

      // 2. Create empty arrays for the tips and the totals ('tips' and 'totals')
        tips = [];
        totals = [];

      // 3. Use the 'calcTip' function we wrote before (no need to repeat) to calculate
      // tips and total values (bill + tip) for every bill value in the bills array. Use a for
      // loop to perform the 10 calculations!
        function calcTip (x){
            return x >= 50 && x <= 300 ? 0.15*x : 0.2*x;
        }
        for (let index = 0; index < bills.length; index++) {
            tips.push(calcTip(bills[index]));
            totals.push(tips[index] + bills[index]);
        }

        for (let index = 0; index < bills.length; index++) {
            console.log(`Bill: ${bills[index]} - Tip: ${tips[index]} - Total: ${totals[index]}`);
        }


      // Test data: 22, 295, 176, 440, 37, 105, 10, 1100, 86 and 52
      // Hints: Call ‘calcTip ‘in the loop and use the push method to add values to the
      // tips and totals arrays 😉
      
      
      // Bonus:
      // 4. Bonus: Write a function 'calcAverage' which takes an array called 'arr' as
      // an argument. This function calculates the average of all numbers in the given
      // array. This is a difficult challenge (we haven't done this before)! Here is how to
      // solve it:
      function calcAverage (arr){
        let sum = 0;
        for (let index = 0; index < arr.length; index++) {
            sum += arr[index];
        }
        return sum / arr.length;
      }
      
      // 4.1. First, you will need to add up all values in the array. To do the addition,
      // start by creating a variable 'sum' that starts at 0. Then loop over the
      // array using a for loop. In each iteration, add the current value to the
      // 'sum' variable. This way, by the end of the loop, you have all values
      // added together
      
      
      // 4.2. To calculate the average, divide the sum you calculated before by the
      // length of the array (because that's the number of elements)
      
      
      // 4.3. Call the function with the 'totals' array
      console.log(`Average totals: ${calcAverage(totals)}`);
    </script>
  </body>
</html>
