<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const dogs = [
        { weight: 22, curFood: 250, owners: ["Alice", "Bob"] },
        { weight: 8, curFood: 200, owners: ["Matilda"] },
        { weight: 13, curFood: 275, owners: ["Sarah", "John"] },
        { weight: 32, curFood: 340, owners: ["Michael"] },
      ];
      // Julia and Kate are still studying dogs, and this time they are studying if dogs are
      // eating too much or too little.
      // Eating too much means the dog's current food portion is larger than the
      // recommended portion, and eating too little is the opposite.
      // Eating an okay amount means the dog's current food portion is within a range 10%
      // above and 10% below the recommended portion (see hint).

      // Your tasks:
      // 1. Loop over the 'dogs' array containing dog objects, and for each dog, calculate
      // the recommended food portion and add it to the object as a new property. Do
      // not create a new array, simply loop over the array. Forumla:
      // recommendedFood = weight ** 0.75 * 28. (The result is in grams of
      // food, and the weight needs to be in kg)
      for (const dog of dogs) {
        dog.recommendedFood = dog.weight ** 0.75 * 28;
      }

      for (const dog in dogs) {
        console.log(dogs[dog]);
      }
      // 2. Find Sarah's dog and log to the console whether it's eating too much or too
      // little. Hint: Some dogs have multiple owners, so you first need to find Sarah in
      // the owners array, and so this one is a bit tricky (on purpose) 🤓
      let sarahDog = dogs.find((dog) => dog.owners.includes("Sarah"));

      if (sarahDog.curFood > sarahDog.recommendedFood * 1.1) {
        console.log("Dog của Sarah ăn quá nhiều");
      } else if (sarahDog.curFood < sarahDog.recommendedFood * 0.9) {
        console.log("Dog của Sarah ăn quá ít");
      } else {
        console.log("Dog của Sarah ăn vừa đủ");
      }

      // 3. Create an array containing all owners of dogs who eat too much
      // ('ownersEatTooMuch') and an array with all owners of dogs who eat too little
      // ('ownersEatTooLittle').
      const ownersEatTooMuch = [];
      const ownersEatTooLittle = [];

      for (const dog of dogs) {
        if (dog.curFood > dog.recommendedFood * 1.1) {
          ownersEatTooMuch.push(...dog.owners);
        } else if (dog.curFood < dog.recommendedFood * 0.9) {
          ownersEatTooLittle.push(...dog.owners);
        }
      }

      // 4. Log a string to the console for each array created in 3., like this: "Matilda and
      // Alice and Bob's dogs eat too much!" and "Sarah and John and Michael's dogs eat
      // too little!"
      console.log(`${ownersEatTooMuch.join(" and ")}'s dogs eat too much!`);
      console.log(`${ownersEatTooLittle.join(" and ")}'s dogs eat too little!`);

      // 5. Log to the console whether there is any dog eating exactly the amount of food
      // that is recommended (just true or false)
      let exaDog = false;
      for (const dog in dogs) {
        if (dogs[dog].curFood == dogs[dog].recommendedFood) {
          exaDog = true;
        }
      }
      if (exaDog == true) {
        console.log("Có con chó ăn đúng lượng thức ăn khuyến nghị");
      } else {
        console.log("Không có con chó nào ăn đúng lượng thức ăn khuyến nghị");
      }

      // 6. Log to the console whether there is any dog eating an okay amount of food
      // (just true or false)

      const checkDog = dogs.some(
        (dog) =>
          dog.curFood >= dog.recommendedFood * 0.9 &&
          dog.curFood <= dog.recommendedFood * 1.1,
      );

      console.log(checkDog);

      // 7. Create an array containing the dogs that are eating an okay amount of food (try
      // to reuse the condition used in 6.)
      const recDog = [];
      for (const dog in dogs) {
        if (
          dogs[dog].curFood >= dogs[dog].recommendedFood * 0.9 &&
          dogs[dog].curFood <= dogs[dog].recommendedFood * 1.1
        ) {
          recDog.push(dogs[dog]);
        }
      }

      // 8. Create a shallow copy of the 'dogs' array and sort it by recommended food
      // portion in an ascending order (keep in mind that the portions are inside the
      // array's objects 😉
      const dogsCopy = [...dogs].sort(
        (a, b) => a.recommendedFood - b.recommendedFood,
      );
    </script>
  </body>
</html>
