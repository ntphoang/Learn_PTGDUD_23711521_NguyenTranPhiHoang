<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // Write a program that receives a list of variable names written in underscore_case
      // and convert them to camelCase.
      // The input will come from a textarea inserted into the DOM (see code below to
      // insert the elements), and conversion will happen when the button is pressed.
      // Test data (pasted to textarea, including spaces):
      // underscore_case
      // first_name
      // Some_Variable
      // calculate_AGE
      // delayed_departure
      // Should produce this output (5 separate console.log outputs):
      // underscoreCase ✅
      // firstName ✅✅
      // someVariable ✅✅✅
      // calculateAge ✅✅✅✅
      // delayedDeparture ✅✅✅✅✅
      document.body.append(document.createElement("textarea"));
      document.body.append(document.createElement("button"));

      const btn = document.querySelector("button");
      btn.textContent = "Hãy ấn vào đây";

      btn.addEventListener("click", ()=>{
        const textarea = document.querySelector("textarea").value;

        let rows = textarea.split("\n");
        
        for (let index = 0; index < rows.length; index++) {
            const row = rows[index].toLowerCase();
            const [first, second] = row.trim().split("_");
            const camelCase = first + second[0].toUpperCase() + second.slice(1);
            console.log(`${camelCase} ${`✅`.repeat(index+1)}`);
            
        }
      });
    </script>
  </body>
</html>
